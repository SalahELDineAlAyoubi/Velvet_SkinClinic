<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid p-2">
    <div class="d-flex order-lg-1 align-items-center gap-2">


      <!-- Logout Button -->
      <button class="btn btn-outline-light btn-sm" style="font-family: 'Cairo', sans-serif;" (click)="logout()">
        تسجيل خروج
      </button>
      <!-- Notifications Icon -->
      <div class="notification-container" dir="rtl">
        <button class="btn btn-outline-light btn-sm notification-btn"
                (click)="toggleNotifications(); $event.stopPropagation()"
                title="الإشعارات">
          <!-- Bell SVG Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6" />
          </svg>
          <span class="notification-badge" *ngIf="birthdayCount > 0">{{ birthdayCount }}</span>
        </button>

        <!-- Notifications Dropdown -->
        <div class="notifications-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
          <div class="notifications-header">
            <h6>🎂 أعياد ميلاد اليوم</h6>
          </div>
          <div class="notifications-body">
            <div *ngIf="birthdayClients.length === 0" class="no-notifications">
              لا توجد أعياد ميلاد اليوم
            </div>
            <div *ngFor="let client of birthdayClients" class="notification-item" (click)="goToClient(client)">
              <div class="notification-icon">🎉</div>
              <div class="notification-content">
                <div class="notification-name">{{ client.name }}</div>
                <div class="notification-date">{{ client.birthday }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Center logo (always centered) -->
    <a class="navbar-brand mx-auto d-flex align-items-center position-absolute start-50 translate-middle-x"
       routerLink="/dashboard">
      <img src="assets/images/logo.png" width="40" height="40" class="me-2">
      <!-- Hidden on mobile, visible from lg and up -->
      <span class="brand-name d-none d-sm-inline me-2">
        Velvet Skin Clinic
      </span>
      <img src="assets/images/logo.png" width="40" height="40" class="me-2 d-none d-sm-inline">
    </a>

    <!-- Collapsible content -->
    <div class="collapse navbar-collapse order-lg-4" id="navbarNav" style="font-family: 'Cairo', sans-serif;">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item pnt">
          <a class="nav-link" routerLink="/statistics">الحسابات الشهرية</a>
        </li>
        <li class="nav-item pnt">
          <a class="nav-link" routerLink="/services">الخدمات</a>
        </li>
        <li class="nav-item pnt">
          <a class="nav-link" routerLink="/dashboard">الصفحة الرئيسية</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
