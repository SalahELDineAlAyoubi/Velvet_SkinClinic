<div class="container" dir="rtl">
  <div class="page-header">
    <h1>قائمة العملاء</h1>
    <p class="subtitle">إدارة ومتابعة جميع العملاء</p>
  </div>

  <!-- Search and Stats Card -->
  <div class="card">
    <div class="search-section">
      <div class="search-wrapper">
        <input type="text"
               class="search-input"
               placeholder="🔍 ابحث عن عميل (الاسم، الهاتف، أو الرقم)"
               [(ngModel)]="searchTerm">
      </div>
      <div class="stats">
        <span class="stat-badge">
          <strong>{{ filteredClients.length }}</strong> عميل
        </span>
      </div>
    </div>
  </div>

  <!-- Clients Table Card -->
  <div class="card">
    <div class="table-wrapper">
      <table class="clients-table">
        <thead>
          <tr>
            <th>رقم التعريف</th>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of paginatedClients"
              class="client-row"
              >
            <td><span class="client-id">{{ client.id }}</span></td>
            <td><strong>{{ client.name }}</strong></td>
            <td dir="ltr" class="mobile">{{ client.mobile }}</td>
            <td (click)="goToClient(client.id)">
              <button class="btn-view" (click)="goToClient(client.id); $event.stopPropagation()">
                عرض التفاصيل ←
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredClients.length === 0">
            <td colspan="4" class="empty-state">
              <div class="empty-content">
                <span class="empty-icon">🔍</span>
                <p>لا توجد نتائج</p>
                <small>حاول البحث بكلمات مختلفة</small>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button class="pagination-btn"
              (click)="prevPage()"
              [disabled]="page === 1">
        ← السابق
      </button>

      <div class="page-info">
        <span class="current-page">{{ page }}</span>
        <span class="separator">من</span>
        <span class="total-pages">{{ totalPages }}</span>
      </div>

      <button class="pagination-btn"
              (click)="nextPage()"
              [disabled]="page === totalPages">
        التالي →
      </button>
    </div>
  </div>
</div>
